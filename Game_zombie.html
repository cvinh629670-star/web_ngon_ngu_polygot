  this.idle.onload=()=>{this.idleFrames=this.measureFrames(this.idle,4)};
  this.shoot.onload=()=>{this.shootFrames=this.measureFrames(this.shoot,8)};
  this.idle.onerror=()=>console.warn('Không tải được alex_idle.png');
  this.shoot.onerror=()=>console.warn('Không tải được alex_shoot.png');

  this.shoot.src='alex_shoot.png';

 // Quét alpha 1 lần khi ảnh tải xong; từng frame có kích thước crop riêng.
 // Hỗ trợ ảnh PNG trong suốt, tránh việc frame bắn trông nhỏ hơn frame đứng.
 measureFrames(img,count) {
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const canvas=document.createElement('canvas');
  canvas.width=iw; canvas.height=ih;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  let pixels=null;
  try { ctx.drawImage(img,0,0); pixels=ctx.getImageData(0,0,iw,ih).data; }
  catch(e) { console.warn('Không đọc được alpha của sprite, dùng chế độ dự phòng',e); }
  const frames=[];
  for(let i=0;i<count;i++) {
   const begin=Math.round(i*iw/count), stop=Math.round((i+1)*iw/count);
   let l=stop, r=begin-1, t=ih, b=-1;
   if(pixels) {
    // Chỉ tính pixel đủ rõ để viền mờ không làm phình bbox.
    for(let y=0;y<ih;y++) for(let x=begin;x<stop;x++) {
     if(pixels[(y*iw+x)*4+3]<32) continue;
     l=Math.min(l,x); r=Math.max(r,x);
     t=Math.min(t,y); b=Math.max(b,y);
    }
   }
   if(b<t) {l=begin;r=stop-1;t=0;b=ih-1;}

   // Neo theo đôi chân ở phần thấp nhất, không theo đầu nòng súng/tia lửa.
   let footL=r,footR=l;
   if(pixels) {
    const footTop=Math.max(t, b-Math.ceil((b-t+1)*.13));
    for(let y=footTop;y<=b;y++) for(let x=l;x<=r;x++) {
     if(pixels[(y*iw+x)*4+3]<80) continue;
     footL=Math.min(footL,x);footR=Math.max(footR,x);
    }
   }
   if(footR<footL){footL=l;footR=r;}
   frames.push({sx:l,sy:t,sw:r-l+1,sh:b-t+1,footX:(footL+footR)/2});
  }

window.game=new Game();
addEventListener('message',event=>{
 if(event.source!==window.parent)return;
 if(event.data?.type==='polyglot-synonym-result'){
  const pending=window.game.synonymRequests.get(event.data.requestId);if(!pending)return;
  clearTimeout(pending.timeout);window.game.synonymRequests.delete(event.data.requestId);
  pending.resolve(Number.isInteger(event.data.matchedIndex)?event.data.matchedIndex:-1);return

  window.game.hostPaused=event.data.visible!==true;
  if(window.game.hostPaused)window.game.ui.returnHome();
